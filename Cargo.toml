[package]
name = "libraryCU"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }

tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

reqwest = { version = "0.12", features = ["json"] }

anyhow = "1"

walkdir = "2"

rusqlite = { version = "0.32", features = ["bundled"] }

colored = "3"

dialoguer = "0.11"
