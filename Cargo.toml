[package]
name = "libraryCU"
version = "0.1.0"
edition = "2024"
description = "A deterministic developer diagnostic toolkit"
license = "MIT"

[lib]
name = "librarycu"
path = "src/lib.rs"

[[bin]]
name = "lcu"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }

tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

reqwest = { version = "0.12", features = ["json"] }

anyhow = "1"

walkdir = "2"

rusqlite = { version = "0.32", features = ["bundled"] }

colored = "3"

dialoguer = "0.11"
