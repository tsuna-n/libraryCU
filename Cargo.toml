[package]
name = "librarycube"
version = "0.5.0"
edition = "2024"
description = "A terminal knowledge library with offline retrieval and optional AI"
license = "MIT"

[lib]
name = "librarycube"
path = "src/lib.rs"

[[bin]]
name = "lbc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }

tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

reqwest = { version = "0.12", features = ["json"] }

anyhow = "1"

walkdir = "2"

rusqlite = { version = "0.32", features = ["bundled"] }

colored = "3"

dialoguer = "0.11"

libc = "0.2"

# Private temporary files with atomic publication and automatic failure cleanup.
tempfile = "3"
# Parse quoted editor arguments without invoking a shell.
shell-words = "1"
ignore = "0.4"
fs2 = "0.4"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
